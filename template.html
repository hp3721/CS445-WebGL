    <title>Stunt Car Remake</title>
    <style type="text/css">
      html, body {
        background-color: black;
        margin: 0;
      }
      .emscripten {
        width: 100%;
        height: 100%;
        display: flex;
        position: absolute;
        align-items: center;
        justify-content: center;
      }
      .game {
        width: auto;
        height: 100%;
      }
      .portrait{
        width: 100%;
        height: auto;
      }
      .loading {
        position: absolute;
      }
      .game[width] + .loading {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="emscripten">
      <canvas class="game portrait" width="800" height="800" oncontextmenu="event.preventDefault()"></canvas>
<!--      <div class="loading">Loading...</div>-->
    </div>
    <script type="text/javascript">
        const $game = document.querySelector('.game');
        const widthToHeight = 800 / 800;
        const resize = () => {
            if(window.innerWidth / window.innerHeight > widthToHeight === $game.classList.contains('portrait')) {
            $game.classList.toggle('portrait');
            }
        }
        var Module = {
            print(text) {
            console.log(Array.prototype.slice.call(arguments).join(' '));
            },
            printErr() {
            console.error(Array.prototype.slice.call(arguments).join(' '));
            },
            canvas: $game
        };
        window.addEventListener('resize', resize, false);
        resize();
    </script>
